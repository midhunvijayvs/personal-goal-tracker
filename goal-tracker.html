<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trajectory — Goal Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11161D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trajectory">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#11161D;
    --panel:#171F29;
    --panel-light:#1F2A38;
    --panel-hover:#243040;
    --text:#E8ECEF;
    --text-dim:#8A97A6;
    --text-faint:#5A6672;
    --teal:#2DD4BF;
    --teal-dim:rgba(45,212,191,0.15);
    --amber:#F2A94A;
    --amber-dim:rgba(242,169,74,0.15);
    --red:#F2555A;
    --red-dim:rgba(242,85,90,0.15);
    --border:#2A3645;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  ::selection{background:var(--teal-dim);}

  /* Layout */
  .app{
    max-width:980px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
  }
  header.top h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-style:italic;
    font-size:30px;
    margin:0;
    letter-spacing:0.2px;
  }
  header.top .tagline{
    color:var(--text-dim);
    font-size:13px;
    margin-top:4px;
  }
  .top-actions{display:flex;gap:8px;align-items:center;}

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn{
    background:var(--panel-light);
    color:var(--text);
    border:1px solid var(--border);
    padding:9px 16px;
    border-radius:var(--radius);
    font-size:13.5px;
    font-weight:500;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn:hover{background:var(--panel-hover);border-color:#38465a;}
  .btn-primary{
    background:var(--teal);
    color:#0B1A18;
    border:1px solid var(--teal);
    font-weight:600;
  }
  .btn-primary:hover{background:#3fe0ca;}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
  }
  .btn-icon{
    background:transparent;
    border:none;
    color:var(--text-dim);
    padding:4px 8px;
    font-size:14px;
    border-radius:6px;
  }
  .btn-icon:hover{color:var(--text);background:var(--panel-hover);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}

  /* Dashboard */
  .dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:28px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat .num{
    font-family:'Fraunces',serif;
    font-size:28px;
    font-weight:600;
    line-height:1;
  }
  .stat .label{
    color:var(--text-dim);
    font-size:12.5px;
    margin-top:6px;
  }
  .stat.overdue .num{color:var(--red);}
  .stat.urgent .num{color:var(--amber);}
  .stat.done .num{color:var(--teal);}

  .upcoming{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:28px;
  }
  .upcoming h3{
    margin:0 0 12px;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    text-transform:none;
  }
  .upcoming-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-top:1px solid var(--border);
    font-size:13.5px;
  }
  .upcoming-row:first-of-type{border-top:none;}
  .upcoming-row .u-title{color:var(--text);}
  .upcoming-row .u-parent{color:var(--text-faint);font-size:12px;margin-left:6px;}
  .upcoming-empty{color:var(--text-faint);font-size:13px;padding:4px 0;}

  .pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:600;
  }
  .pill.overdue{background:var(--red-dim);color:var(--red);}
  .pill.urgent{background:var(--amber-dim);color:var(--amber);}
  .pill.ok{background:var(--teal-dim);color:var(--teal);}

  /* Controls row */
  .controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    gap:10px;
    flex-wrap:wrap;
  }
  .sort-select{
    background:var(--panel-light);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:8px 12px;
    font-size:13px;
    font-family:inherit;
  }

  /* Goal cards */
  .goal{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:3px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:14px;
    overflow:hidden;
  }
  .goal.pri-high{border-left-color:var(--red);}
  .goal.pri-medium{border-left-color:var(--amber);}
  .goal.pri-low{border-left-color:var(--teal);}

  .goal-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    cursor:pointer;
  }
  .goal-head .chev{
    color:var(--text-faint);
    font-size:11px;
    transition:transform .15s ease;
    width:10px;
  }
  .goal.open .chev{transform:rotate(90deg);}
  .goal-title-wrap{flex:1;min-width:0;}
  .goal-title{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .goal-title.done{color:var(--text-faint);text-decoration:line-through;}
  .goal-meta{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:5px;
    font-size:12px;
    color:var(--text-dim);
  }
  .progress-wrap{
    width:110px;
    flex-shrink:0;
  }
  .progress-track{
    background:var(--panel-light);
    border-radius:20px;
    height:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--teal);
    border-radius:20px;
    transition:width .25s ease;
  }
  .progress-pct{
    font-size:11px;
    color:var(--text-dim);
    margin-top:4px;
    text-align:right;
  }
  .goal-actions{display:flex;gap:2px;flex-shrink:0;}

  .goal-body{
    display:none;
    padding:0 18px 18px;
    border-top:1px solid var(--border);
  }
  .goal.open .goal-body{display:block;}

  .subtasks{margin-top:14px;}
  .subtask{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 0;
    border-top:1px solid var(--border);
  }
  .subtask:first-child{border-top:none;}
  .check{
    width:18px;height:18px;
    border-radius:5px;
    border:1.5px solid var(--text-faint);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:12px;
    color:transparent;
  }
  .check.checked{background:var(--teal);border-color:var(--teal);color:#0B1A18;}
  .sub-title{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sub-title.done{color:var(--text-faint);text-decoration:line-through;}
  .sub-deadline{font-size:11.5px;color:var(--text-dim);flex-shrink:0;}
  .sub-pct{
    width:46px;
    background:var(--panel-light);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    font-size:11.5px;
    padding:3px 4px;
    text-align:center;
    flex-shrink:0;
  }
  .sub-actions{flex-shrink:0;}

  .add-sub-row, .add-goal-row{
    margin-top:12px;
  }
  .add-sub-btn{
    font-size:12.5px;
    color:var(--text-dim);
    background:transparent;
    border:1px dashed var(--border);
    padding:7px 12px;
    border-radius:8px;
    width:100%;
    text-align:left;
  }
  .add-sub-btn:hover{color:var(--text);border-color:var(--text-faint);}

  .goal-notes{
    margin-top:14px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .goal-own-progress{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .goal-own-progress input[type=range]{flex:1;accent-color:var(--teal);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  .empty-state .big{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:20px;
    color:var(--text);
    margin-bottom:6px;
  }

  /* Modal */
  .overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(5,8,12,0.7);
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    width:100%;
    max-width:420px;
    padding:22px;
  }
  .modal h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 16px;
  }
  .field{margin-bottom:13px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:5px;
  }
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%;
    background:var(--panel-light);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 11px;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:50px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }

  /* Settings */
  .settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-top:1px solid var(--border);
    font-size:13.5px;
  }
  .settings-row:first-child{border-top:none;}
  .toggle{
    width:38px;height:22px;
    background:var(--panel-light);
    border:1px solid var(--border);
    border-radius:20px;
    position:relative;
    cursor:pointer;
  }
  .toggle.on{background:var(--teal-dim);border-color:var(--teal);}
  .toggle .knob{
    position:absolute;top:2px;left:2px;
    width:16px;height:16px;
    background:var(--text-faint);
    border-radius:50%;
    transition:left .15s ease, background .15s ease;
  }
  .toggle.on .knob{left:18px;background:var(--teal);}
  .num-input{
    width:60px;
    background:var(--panel-light);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:5px 8px;
    font-size:13px;
    text-align:center;
  }

  @media (max-width:640px){
    .dashboard{grid-template-columns:repeat(2,1fr);}
    .progress-wrap{width:72px;}
    .field-row{flex-direction:column;gap:0;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Trajectory</h1>
      <div class="tagline">Your goals, broken down and on track.</div>
    </div>
    <div class="top-actions">
      <span id="syncStatus" class="pill ok" style="cursor:pointer;" title="Click to open sync settings">Not connected</span>
      <button class="btn btn-ghost btn-sm" id="settingsBtn">Settings</button>
      <button class="btn btn-primary" id="newGoalBtn">+ New goal</button>
    </div>
  </header>

  <div class="dashboard" id="dashboard"></div>

  <div class="upcoming">
    <h3>Upcoming deadlines</h3>
    <div id="upcomingList"></div>
  </div>

  <div class="controls">
    <div style="font-size:13px;color:var(--text-dim);" id="goalCount"></div>
    <select class="sort-select" id="sortSelect">
      <option value="deadline">Sort by deadline</option>
      <option value="priority">Sort by priority</option>
      <option value="progress">Sort by progress</option>
      <option value="created">Sort by date added</option>
    </select>
  </div>

  <div id="goalList"></div>
</div>

<!-- Goal Modal -->
<div class="overlay" id="goalOverlay">
  <div class="modal">
    <h2 id="goalModalTitle">New goal</h2>
    <div class="field">
      <label>Goal title</label>
      <input type="text" id="goalTitleInput" placeholder="e.g. Finish GATE 2027 prep">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Priority</label>
        <select id="goalPriorityInput">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="field">
        <label>Deadline</label>
        <input type="date" id="goalDeadlineInput">
      </div>
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="goalNotesInput" placeholder="Any context for this goal"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="goalCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="goalSaveBtn">Save goal</button>
    </div>
  </div>
</div>

<!-- Subtask Modal -->
<div class="overlay" id="subOverlay">
  <div class="modal">
    <h2 id="subModalTitle">New subtask</h2>
    <div class="field">
      <label>Subtask title</label>
      <input type="text" id="subTitleInput" placeholder="e.g. Finish Engineering Maths revision">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Priority</label>
        <select id="subPriorityInput">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="field">
        <label>Deadline</label>
        <input type="date" id="subDeadlineInput">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="subCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="subSaveBtn">Save subtask</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>Settings</h2>
    <div class="settings-row">
      <span id="driveStatusLabel">Google Drive: not connected</span>
      <button class="btn btn-sm btn-primary" id="driveConnectBtn">Connect</button>
      <button class="btn btn-sm btn-ghost" id="driveDisconnectBtn" style="display:none;">Disconnect</button>
    </div>
    <div class="settings-row" id="driveSyncRow" style="display:none;">
      <span id="lastSyncedLabel">Not synced yet</span>
      <button class="btn btn-sm btn-ghost" id="driveSyncNowBtn">Sync now</button>
    </div>
    <div class="settings-row">
      <span>Sound alerts for near deadlines</span>
      <div class="toggle" id="soundToggle"><div class="knob"></div></div>
    </div>
    <div class="settings-row">
      <span>Warn when deadline is within (hours)</span>
      <input type="number" class="num-input" id="warnHoursInput" min="1" max="336">
    </div>
    <div class="settings-row">
      <span>Test the alert sound</span>
      <button class="btn btn-sm btn-ghost" id="testSoundBtn">Play sound</button>
    </div>
    <div class="settings-row">
      <span style="color:var(--red);">Clear all data</span>
      <button class="btn btn-sm btn-ghost" id="clearDataBtn" style="border-color:var(--red);color:var(--red);">Clear</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="settingsCloseBtn">Done</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "trajectory_data_v1";
  var state = loadState();
  var openGoalId = null; // which goal card is expanded
  var editingGoalId = null; // null = creating new
  var subtaskContext = { goalId: null, subtaskId: null }; // subtaskId null = creating new
  var alertedIds = {}; // tracks which items we've already beeped for this session

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error("Could not load saved data", e); }
    return {
      goals: [],
      settings: { soundEnabled: true, warnHours: 48 }
    };
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error("Could not save data", e); }
    scheduleDrivePush();
  }

  // ---------- Google Drive sync ----------
  // Paste your own OAuth Client ID below if it ever changes. This ID is public
  // and safe to embed here — it's not a secret.
  var DRIVE_CLIENT_ID = "196324205483-t6ulmlbh78gau4q0dg637t9bt8k8upjs.apps.googleusercontent.com";
  var DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata";
  var DRIVE_FILE_NAME = "trajectory-data.json";
  var DRIVE_CONNECTED_KEY = "trajectory_drive_connected";

  var driveTokenClient = null;
  var driveAccessToken = null;
  var driveFileId = null;
  var drivePushTimer = null;
  var isApplyingRemoteState = false; // guards against re-pushing data we just pulled

  function updateSyncUI(connected, syncing){
    var pill = document.getElementById("syncStatus");
    var label = document.getElementById("driveStatusLabel");
    var connectBtn = document.getElementById("driveConnectBtn");
    var disconnectBtn = document.getElementById("driveDisconnectBtn");
    var syncRow = document.getElementById("driveSyncRow");

    if(connected){
      pill.textContent = syncing ? "Syncing…" : "Synced to Drive";
      pill.className = "pill ok";
      label.textContent = "Google Drive: connected";
      connectBtn.style.display = "none";
      disconnectBtn.style.display = "";
      syncRow.style.display = "flex";
    } else {
      pill.textContent = "Not connected";
      pill.className = "pill urgent";
      label.textContent = "Google Drive: not connected";
      connectBtn.style.display = "";
      disconnectBtn.style.display = "none";
      syncRow.style.display = "none";
    }
  }

  function setLastSyncedNow(){
    var el = document.getElementById("lastSyncedLabel");
    if(el) el.textContent = "Last synced " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  }

  function initGoogleDrive(){
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      // Google script hasn't loaded yet — retry shortly.
      setTimeout(initGoogleDrive, 400);
      return;
    }
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: function(resp){
        if(resp && resp.access_token){
          driveAccessToken = resp.access_token;
          localStorage.setItem(DRIVE_CONNECTED_KEY, "true");
          updateSyncUI(true, true);
          pullFromDrive(function(){ updateSyncUI(true, false); setLastSyncedNow(); });
        }
      },
      error_callback: function(){
        updateSyncUI(false, false);
      }
    });

    // If we connected before, try to reconnect quietly (no popup) on load.
    if(localStorage.getItem(DRIVE_CONNECTED_KEY) === "true"){
      driveTokenClient.requestAccessToken({ prompt: "" });
    }
  }

  document.getElementById("driveConnectBtn").addEventListener("click", function(){
    if(!driveTokenClient){ alert("Google sign-in is still loading — try again in a moment."); return; }
    driveTokenClient.requestAccessToken({ prompt: "consent" });
  });

  document.getElementById("driveDisconnectBtn").addEventListener("click", function(){
    if(driveAccessToken && window.google && google.accounts && google.accounts.oauth2){
      google.accounts.oauth2.revoke(driveAccessToken, function(){});
    }
    driveAccessToken = null;
    driveFileId = null;
    localStorage.removeItem(DRIVE_CONNECTED_KEY);
    updateSyncUI(false, false);
  });

  document.getElementById("driveSyncNowBtn").addEventListener("click", function(){
    if(!driveAccessToken) return;
    updateSyncUI(true, true);
    pullFromDrive(function(){ updateSyncUI(true, false); setLastSyncedNow(); });
  });

  function driveApiFetch(url, options){
    options = options || {};
    options.headers = options.headers || {};
    options.headers["Authorization"] = "Bearer " + driveAccessToken;
    return fetch(url, options);
  }

  function findDriveFile(callback){
    var url = "https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=" +
      encodeURIComponent("name='" + DRIVE_FILE_NAME + "'");
    driveApiFetch(url).then(function(r){ return r.json(); }).then(function(data){
      if(data.files && data.files.length > 0){
        driveFileId = data.files[0].id;
      }
      callback();
    }).catch(function(e){ console.error("Drive lookup failed", e); callback(); });
  }

  function pullFromDrive(done){
    findDriveFile(function(){
      if(!driveFileId){
        // No file yet on Drive — push what we have locally to create it.
        pushToDrive(done);
        return;
      }
      driveApiFetch("https://www.googleapis.com/drive/v3/files/" + driveFileId + "?alt=media")
        .then(function(r){ return r.json(); })
        .then(function(remote){
          if(remote && remote.goals){
            isApplyingRemoteState = true;
            state = remote;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            isApplyingRemoteState = false;
            openGoalId = null;
            render();
          }
          if(done) done();
        })
        .catch(function(e){ console.error("Drive pull failed", e); if(done) done(); });
    });
  }

  function pushToDrive(done){
    if(!driveAccessToken) return;
    var payload = JSON.stringify(state);
    var metadata = { name: DRIVE_FILE_NAME, parents: driveFileId ? undefined : ["appDataFolder"] };
    var boundary = "trajectory_boundary";
    var body =
      "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify(metadata) + "\r\n" +
      "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" +
      payload + "\r\n--" + boundary + "--";

    var url = driveFileId
      ? "https://www.googleapis.com/upload/drive/v3/files/" + driveFileId + "?uploadType=multipart"
      : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
    var method = driveFileId ? "PATCH" : "POST";

    driveApiFetch(url, {
      method: method,
      headers: { "Content-Type": "multipart/related; boundary=" + boundary },
      body: body
    }).then(function(r){ return r.json(); })
      .then(function(result){
        if(result.id) driveFileId = result.id;
        if(done) done();
        setLastSyncedNow();
      })
      .catch(function(e){ console.error("Drive push failed", e); if(done) done(); });
  }

  function scheduleDrivePush(){
    if(!driveAccessToken || isApplyingRemoteState) return;
    if(drivePushTimer) clearTimeout(drivePushTimer);
    updateSyncUI(true, true);
    drivePushTimer = setTimeout(function(){
      pushToDrive(function(){ updateSyncUI(true, false); });
    }, 1500);
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  // ---------- Deadline helpers ----------
  function hoursUntil(dateStr){
    if(!dateStr) return null;
    var target = new Date(dateStr + "T23:59:59");
    var now = new Date();
    return (target - now) / 36e5;
  }

  function urgencyOf(dateStr){
    if(!dateStr) return "none";
    var h = hoursUntil(dateStr);
    if(h < 0) return "overdue";
    if(h <= state.settings.warnHours) return "urgent";
    return "ok";
  }

  function formatDeadline(dateStr){
    if(!dateStr) return "No deadline";
    var h = hoursUntil(dateStr);
    var d = new Date(dateStr + "T00:00:00");
    var dateLabel = d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
    if(h < 0){
      var daysOver = Math.ceil(Math.abs(h)/24);
      return dateLabel + " · overdue " + daysOver + "d";
    }
    var daysLeft = Math.ceil(h/24);
    if(daysLeft <= 1) return dateLabel + " · due today/tomorrow";
    return dateLabel + " · " + daysLeft + "d left";
  }

  // ---------- Sound ----------
  var audioCtx = null;
  function playAlertSound(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;
      [0, 0.18].forEach(function(offset){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now+offset);
        gain.gain.setValueAtTime(0.0001, now+offset);
        gain.gain.exponentialRampToValueAtTime(0.18, now+offset+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.16);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now+offset);
        osc.stop(now+offset+0.17);
      });
    }catch(e){ console.error("Sound playback failed", e); }
  }

  function checkForNewUrgentAlerts(){
    if(!state.settings.soundEnabled) return;
    var shouldBeep = false;
    state.goals.forEach(function(g){
      if(g.done) return;
      if(urgencyOf(g.deadline) === "urgent" && !alertedIds[g.id]){
        alertedIds[g.id] = true; shouldBeep = true;
      }
      (g.subtasks||[]).forEach(function(s){
        if(s.done) return;
        if(urgencyOf(s.deadline) === "urgent" && !alertedIds[s.id]){
          alertedIds[s.id] = true; shouldBeep = true;
        }
      });
    });
    if(shouldBeep) playAlertSound();
  }

  // ---------- Progress calculation ----------
  function goalProgress(g){
    if(!g.subtasks || g.subtasks.length === 0){
      return g.done ? 100 : (g.manualPct || 0);
    }
    var total = 0;
    g.subtasks.forEach(function(s){
      total += s.done ? 100 : (s.manualPct || 0);
    });
    return Math.round(total / g.subtasks.length);
  }

  function goalIsDone(g){
    if(!g.subtasks || g.subtasks.length === 0) return !!g.done;
    return g.subtasks.every(function(s){ return s.done; });
  }

  // ---------- Rendering ----------
  function render(){
    renderDashboard();
    renderUpcoming();
    renderGoalList();
    saveState();
    checkForNewUrgentAlerts();
  }

  function renderDashboard(){
    var total = state.goals.length;
    var completed = state.goals.filter(goalIsDone).length;
    var overdue = 0, urgent = 0;
    state.goals.forEach(function(g){
      if(goalIsDone(g)) return;
      var u = urgencyOf(g.deadline);
      if(u === "overdue") overdue++;
      else if(u === "urgent") urgent++;
      (g.subtasks||[]).forEach(function(s){
        if(s.done) return;
        var su = urgencyOf(s.deadline);
        if(su === "overdue") overdue++;
        else if(su === "urgent") urgent++;
      });
    });

    var el = document.getElementById("dashboard");
    el.innerHTML =
      stat(total, "Main goals", "") +
      stat(completed, "Completed", "done") +
      stat(urgent, "Due soon", "urgent") +
      stat(overdue, "Overdue", "overdue");
  }

  function stat(num, label, cls){
    return '<div class="stat '+cls+'"><div class="num">'+num+'</div><div class="label">'+label+'</div></div>';
  }

  function renderUpcoming(){
    var items = [];
    state.goals.forEach(function(g){
      if(!goalIsDone(g) && g.deadline){
        items.push({title:g.title, deadline:g.deadline, parent:null});
      }
      (g.subtasks||[]).forEach(function(s){
        if(!s.done && s.deadline){
          items.push({title:s.title, deadline:s.deadline, parent:g.title});
        }
      });
    });
    items.sort(function(a,b){ return new Date(a.deadline) - new Date(b.deadline); });
    items = items.slice(0,6);

    var el = document.getElementById("upcomingList");
    if(items.length === 0){
      el.innerHTML = '<div class="upcoming-empty">No upcoming deadlines. Add one to a goal or subtask.</div>';
      return;
    }
    el.innerHTML = items.map(function(it){
      var u = urgencyOf(it.deadline);
      var pillCls = u === "overdue" ? "overdue" : (u === "urgent" ? "urgent" : "ok");
      return '<div class="upcoming-row">' +
        '<span><span class="u-title">'+escapeHtml(it.title)+'</span>' +
        (it.parent ? '<span class="u-parent">— '+escapeHtml(it.parent)+'</span>' : '') +
        '</span>' +
        '<span class="pill '+pillCls+'">'+formatDeadline(it.deadline)+'</span>' +
        '</div>';
    }).join("");
  }

  function sortedGoals(){
    var list = state.goals.slice();
    var sortBy = document.getElementById("sortSelect").value;
    var prioRank = {high:0, medium:1, low:2};
    if(sortBy === "deadline"){
      list.sort(function(a,b){
        if(!a.deadline) return 1;
        if(!b.deadline) return -1;
        return new Date(a.deadline) - new Date(b.deadline);
      });
    } else if(sortBy === "priority"){
      list.sort(function(a,b){ return prioRank[a.priority] - prioRank[b.priority]; });
    } else if(sortBy === "progress"){
      list.sort(function(a,b){ return goalProgress(b) - goalProgress(a); });
    } else {
      list.sort(function(a,b){ return a.createdAt - b.createdAt; });
    }
    return list;
  }

  function renderGoalList(){
    var el = document.getElementById("goalList");
    var countEl = document.getElementById("goalCount");
    countEl.textContent = state.goals.length + (state.goals.length === 1 ? " goal" : " goals");

    if(state.goals.length === 0){
      el.innerHTML = '<div class="empty-state"><div class="big">No goals yet</div>' +
        'Add your first main goal to start breaking it down into tasks.</div>';
      return;
    }

    el.innerHTML = sortedGoals().map(renderGoalCard).join("");
    attachGoalListeners();
  }

  function renderGoalCard(g){
    var pct = goalProgress(g);
    var done = goalIsDone(g);
    var isOpen = openGoalId === g.id;
    var u = urgencyOf(g.deadline);
    var subCount = (g.subtasks||[]).length;
    var subDoneCount = (g.subtasks||[]).filter(function(s){return s.done;}).length;

    var pillHtml = "";
    if(g.deadline && !done){
      var pillCls = u === "overdue" ? "overdue" : (u === "urgent" ? "urgent" : "ok");
      pillHtml = '<span class="pill '+pillCls+'">'+formatDeadline(g.deadline)+'</span>';
    }

    var subtasksHtml = (g.subtasks||[]).map(function(s){ return renderSubtask(g, s); }).join("");

    var ownProgressHtml = "";
    if(subCount === 0){
      ownProgressHtml =
        '<div class="goal-own-progress">' +
          '<label class="check '+(g.done?"checked":"")+'" data-action="toggle-goal-done" data-goal="'+g.id+'">'+(g.done?"✓":"")+'</label>' +
          '<span>Mark goal as done, or set progress:</span>' +
          '<input type="range" min="0" max="100" value="'+(g.manualPct||0)+'" data-action="goal-pct" data-goal="'+g.id+'" '+(g.done?"disabled":"")+'>' +
          '<span style="width:34px;text-align:right;">'+(g.done?100:(g.manualPct||0))+'%</span>' +
        '</div>';
    }

    return '<div class="goal pri-'+g.priority+' '+(isOpen?"open":"")+'" data-goal-id="'+g.id+'">' +
      '<div class="goal-head" data-action="toggle-open" data-goal="'+g.id+'">' +
        '<span class="chev">▶</span>' +
        '<div class="goal-title-wrap">' +
          '<p class="goal-title '+(done?"done":"")+'">'+escapeHtml(g.title)+'</p>' +
          '<div class="goal-meta">' +
            '<span style="text-transform:capitalize;">'+g.priority+' priority</span>' +
            (subCount > 0 ? '<span>· '+subDoneCount+'/'+subCount+' subtasks</span>' : '') +
            (pillHtml ? '<span>· </span>'+pillHtml : (done ? '<span class="pill ok">Done</span>' : '')) +
          '</div>' +
        '</div>' +
        '<div class="progress-wrap">' +
          '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>' +
          '<div class="progress-pct">'+pct+'%</div>' +
        '</div>' +
        '<div class="goal-actions">' +
          '<button class="btn-icon" data-action="edit-goal" data-goal="'+g.id+'" title="Edit">✎</button>' +
          '<button class="btn-icon" data-action="delete-goal" data-goal="'+g.id+'" title="Delete">🗑</button>' +
        '</div>' +
      '</div>' +
      '<div class="goal-body">' +
        (g.notes ? '<div class="goal-notes">'+escapeHtml(g.notes)+'</div>' : '') +
        '<div class="subtasks">'+subtasksHtml+'</div>' +
        '<div class="add-sub-row"><button class="add-sub-btn" data-action="add-subtask" data-goal="'+g.id+'">+ Add subtask</button></div>' +
        ownProgressHtml +
      '</div>' +
    '</div>';
  }

  function renderSubtask(g, s){
    var u = urgencyOf(s.deadline);
    var pillCls = u === "overdue" ? "overdue" : (u === "urgent" ? "urgent" : "ok");
    return '<div class="subtask" data-sub-id="'+s.id+'">' +
      '<div class="check '+(s.done?"checked":"")+'" data-action="toggle-sub-done" data-goal="'+g.id+'" data-sub="'+s.id+'">'+(s.done?"✓":"")+'</div>' +
      '<span class="sub-title '+(s.done?"done":"")+'">'+escapeHtml(s.title)+'</span>' +
      (s.deadline && !s.done ? '<span class="pill '+pillCls+'">'+formatDeadline(s.deadline)+'</span>' : '') +
      '<input type="number" class="sub-pct" min="0" max="100" value="'+(s.done?100:(s.manualPct||0))+'" '+(s.done?"disabled":"")+' data-action="sub-pct" data-goal="'+g.id+'" data-sub="'+s.id+'" title="Completion %">' +
      '<div class="sub-actions"><button class="btn-icon" data-action="delete-sub" data-goal="'+g.id+'" data-sub="'+s.id+'" title="Delete">🗑</button></div>' +
    '</div>';
  }

  function escapeHtml(str){
    var d = document.createElement("div");
    d.textContent = str == null ? "" : str;
    return d.innerHTML;
  }

  // ---------- Event delegation ----------
  function attachGoalListeners(){
    var list = document.getElementById("goalList");
    list.onclick = function(e){
      var btn = e.target.closest("[data-action]");
      if(!btn) return;
      var action = btn.getAttribute("data-action");
      var goalId = btn.getAttribute("data-goal");
      var subId = btn.getAttribute("data-sub");

      if(action === "toggle-open"){
        openGoalId = openGoalId === goalId ? null : goalId;
        renderGoalList();
      } else if(action === "edit-goal"){
        e.stopPropagation(); openGoalEditor(goalId);
      } else if(action === "delete-goal"){
        e.stopPropagation();
        if(confirm("Delete this goal and all its subtasks?")){
          state.goals = state.goals.filter(function(g){ return g.id !== goalId; });
          render();
        }
      } else if(action === "toggle-goal-done"){
        e.stopPropagation();
        var g = findGoal(goalId);
        g.done = !g.done;
        render();
      } else if(action === "add-subtask"){
        e.stopPropagation(); openSubtaskEditor(goalId, null);
      } else if(action === "toggle-sub-done"){
        e.stopPropagation();
        var s = findSub(goalId, subId);
        s.done = !s.done;
        render();
      } else if(action === "delete-sub"){
        e.stopPropagation();
        var g2 = findGoal(goalId);
        g2.subtasks = g2.subtasks.filter(function(s){ return s.id !== subId; });
        render();
      }
    };

    list.oninput = function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.getAttribute("data-action");
      var goalId = el.getAttribute("data-goal");
      var subId = el.getAttribute("data-sub");
      if(action === "goal-pct"){
        findGoal(goalId).manualPct = parseInt(el.value, 10);
        updateProgressUIOnly();
      } else if(action === "sub-pct"){
        var v = Math.max(0, Math.min(100, parseInt(el.value || "0", 10)));
        findSub(goalId, subId).manualPct = v;
        updateProgressUIOnly();
      }
    };
    list.onchange = function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      saveState();
    };
  }

  // Lightweight re-render of just progress bars/pct while dragging sliders, to avoid losing focus
  function updateProgressUIOnly(){
    document.querySelectorAll(".goal").forEach(function(card){
      var gid = card.getAttribute("data-goal-id");
      var g = findGoal(gid);
      if(!g) return;
      var pct = goalProgress(g);
      var fill = card.querySelector(".progress-fill");
      var pctLabel = card.querySelector(".progress-pct");
      if(fill) fill.style.width = pct + "%";
      if(pctLabel) pctLabel.textContent = pct + "%";
    });
    renderDashboard();
    saveState();
  }

  function findGoal(id){
    return state.goals.find(function(g){ return g.id === id; });
  }
  function findSub(goalId, subId){
    var g = findGoal(goalId);
    if(!g) return null;
    return g.subtasks.find(function(s){ return s.id === subId; });
  }

  // ---------- Goal modal ----------
  var goalOverlay = document.getElementById("goalOverlay");
  document.getElementById("newGoalBtn").onclick = function(){ openGoalEditor(null); };
  document.getElementById("goalCancelBtn").onclick = function(){ goalOverlay.classList.remove("show"); };
  goalOverlay.onclick = function(e){ if(e.target === goalOverlay) goalOverlay.classList.remove("show"); };

  function openGoalEditor(goalId){
    editingGoalId = goalId;
    var titleEl = document.getElementById("goalModalTitle");
    var titleInput = document.getElementById("goalTitleInput");
    var prioInput = document.getElementById("goalPriorityInput");
    var deadlineInput = document.getElementById("goalDeadlineInput");
    var notesInput = document.getElementById("goalNotesInput");

    if(goalId){
      var g = findGoal(goalId);
      titleEl.textContent = "Edit goal";
      titleInput.value = g.title;
      prioInput.value = g.priority;
      deadlineInput.value = g.deadline || "";
      notesInput.value = g.notes || "";
    } else {
      titleEl.textContent = "New goal";
      titleInput.value = "";
      prioInput.value = "medium";
      deadlineInput.value = "";
      notesInput.value = "";
    }
    goalOverlay.classList.add("show");
    titleInput.focus();
  }

  document.getElementById("goalSaveBtn").onclick = function(){
    var title = document.getElementById("goalTitleInput").value.trim();
    if(!title){ alert("Give your goal a title."); return; }
    var priority = document.getElementById("goalPriorityInput").value;
    var deadline = document.getElementById("goalDeadlineInput").value;
    var notes = document.getElementById("goalNotesInput").value.trim();

    if(editingGoalId){
      var g = findGoal(editingGoalId);
      g.title = title; g.priority = priority; g.deadline = deadline; g.notes = notes;
    } else {
      state.goals.push({
        id: uid(), title: title, priority: priority, deadline: deadline,
        notes: notes, done: false, manualPct: 0, subtasks: [], createdAt: Date.now()
      });
    }
    goalOverlay.classList.remove("show");
    render();
  };

  // ---------- Subtask modal ----------
  var subOverlay = document.getElementById("subOverlay");
  document.getElementById("subCancelBtn").onclick = function(){ subOverlay.classList.remove("show"); };
  subOverlay.onclick = function(e){ if(e.target === subOverlay) subOverlay.classList.remove("show"); };

  function openSubtaskEditor(goalId, subId){
    subtaskContext = { goalId: goalId, subtaskId: subId };
    var titleEl = document.getElementById("subModalTitle");
    var titleInput = document.getElementById("subTitleInput");
    var prioInput = document.getElementById("subPriorityInput");
    var deadlineInput = document.getElementById("subDeadlineInput");

    if(subId){
      var s = findSub(goalId, subId);
      titleEl.textContent = "Edit subtask";
      titleInput.value = s.title;
      prioInput.value = s.priority;
      deadlineInput.value = s.deadline || "";
    } else {
      titleEl.textContent = "New subtask";
      titleInput.value = "";
      prioInput.value = "medium";
      deadlineInput.value = "";
    }
    subOverlay.classList.add("show");
    titleInput.focus();
  }

  document.getElementById("subSaveBtn").onclick = function(){
    var title = document.getElementById("subTitleInput").value.trim();
    if(!title){ alert("Give the subtask a title."); return; }
    var priority = document.getElementById("subPriorityInput").value;
    var deadline = document.getElementById("subDeadlineInput").value;
    var g = findGoal(subtaskContext.goalId);

    if(subtaskContext.subtaskId){
      var s = findSub(subtaskContext.goalId, subtaskContext.subtaskId);
      s.title = title; s.priority = priority; s.deadline = deadline;
    } else {
      g.subtasks.push({ id: uid(), title: title, priority: priority, deadline: deadline, done: false, manualPct: 0 });
    }
    subOverlay.classList.remove("show");
    openGoalId = g.id;
    render();
  };

  // ---------- Settings modal ----------
  var settingsOverlay = document.getElementById("settingsOverlay");
  function openSettings(){
    document.getElementById("warnHoursInput").value = state.settings.warnHours;
    updateSoundToggleUI();
    settingsOverlay.classList.add("show");
  }
  document.getElementById("settingsBtn").onclick = openSettings;
  document.getElementById("syncStatus").onclick = openSettings;
  document.getElementById("settingsCloseBtn").onclick = function(){ settingsOverlay.classList.remove("show"); };
  settingsOverlay.onclick = function(e){ if(e.target === settingsOverlay) settingsOverlay.classList.remove("show"); };

  function updateSoundToggleUI(){
    var t = document.getElementById("soundToggle");
    t.classList.toggle("on", state.settings.soundEnabled);
  }
  document.getElementById("soundToggle").onclick = function(){
    state.settings.soundEnabled = !state.settings.soundEnabled;
    updateSoundToggleUI();
    saveState();
  };
  document.getElementById("warnHoursInput").onchange = function(e){
    var v = parseInt(e.target.value, 10);
    if(isNaN(v) || v < 1) v = 48;
    state.settings.warnHours = v;
    alertedIds = {}; // re-evaluate urgency with new threshold
    saveState();
    render();
  };
  document.getElementById("testSoundBtn").onclick = function(){ playAlertSound(); };
  document.getElementById("clearDataBtn").onclick = function(){
    if(confirm("This will permanently delete all goals and subtasks. Continue?")){
      state = { goals: [], settings: { soundEnabled: true, warnHours: 48 } };
      alertedIds = {};
      saveState();
      render();
      settingsOverlay.classList.remove("show");
    }
  };

  // ---------- Sort control ----------
  document.getElementById("sortSelect").onchange = renderGoalList;

  // ---------- Periodic re-check for deadline alerts ----------
  setInterval(function(){
    renderDashboard();
    renderUpcoming();
    checkForNewUrgentAlerts();
    // Refresh pill states in the open card without collapsing it
    renderGoalList();
  }, 60000);

  // ---------- Init ----------
  render();
  initGoogleDrive();

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.error("Service worker registration failed", e);
    });
  }
})();
</script>
